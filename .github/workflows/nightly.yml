name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  pre-check:
    name: Pre-check
    runs-on: ubuntu-latest
    outputs:
      commit_count: ${{ steps.get_commit_count.outputs.commit_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to count the commits

      - name: Get new commits
        id: get_commit_count
        run: echo "commit_count=$(git log --oneline --since '24 hours ago' | wc -l)" >> $GITHUB_OUTPUT

  build:
    name: Build (Linux)
    needs: [pre-check]
    if: ${{ needs.pre-check.outputs.commit_count > 0 }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build binaries
        run: cargo build --workspace --release --all-targets

      - name: Archive binaries
        run: |
          tar -czf algotrap-Linux.tar.gz -C target/release cryptobot etf_dashboard
          echo "ASSET=algotrap-Linux.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: algotrap-Linux
          path: ${{ env.ASSET }}

  create-release:
    name: Create Release
    needs: [build, pre-check]
    if: ${{ needs.pre-check.outputs.commit_count > 0 }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly Build ${{ github.run_id }}
          tag_name: nightly-${{ github.run_id }}
          token: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
          draft: false
          prerelease: false
          files: |
            artifacts/algotrap-Linux/algotrap-Linux.tar.gz

  build-and-push-docker:
    name: Build and Push Docker Images
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set repository name to lowercase
        id: repo_lowercase
        run: echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # No QEMU — linux/amd64 only, native build is faster
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (base)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: base.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-bins:latest
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-bins:nightly-${{ github.run_id }}

      - name: Build and push Docker image (cryptobot)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bins/cryptobot/deployment/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-cryptobot:latest
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-cryptobot:nightly-${{ github.run_id }}

      - name: Build and push Docker image (telegrambot)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bins/telegrambot/deployment/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-telegrambot:latest
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-telegrambot:nightly-${{ github.run_id }}
