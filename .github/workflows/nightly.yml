name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  pre-check:
    name: Pre-check
    runs-on: ubuntu-latest
    outputs:
      commit_count: ${{ steps.get_commit_count.outputs.commit_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to count the commits

      - name: Get new commits
        id: get_commit_count
        run: echo "commit_count=$(git log --oneline --since '24 hours ago' | wc -l)" >> $GITHUB_OUTPUT

  build-and-push-docker:
    name: Build and Push Docker Images
    needs: [pre-check]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.pre-check.outputs.commit_count > 0 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set repository name to lowercase
        id: repo_lowercase
        run: echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (cryptobot)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bins/cryptobot/deployment/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-cryptobot:latest
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-cryptobot:nightly-${{ github.run_id }}

      - name: Build and push Docker image (telegrambot)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: bins/telegrambot/deployment/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-telegrambot:latest
            ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-telegrambot:nightly-${{ github.run_id }}

      - name: Extract Linux binaries from cryptobot image
        run: |
          IMAGE="ghcr.io/${{ steps.repo_lowercase.outputs.repo }}-cryptobot:nightly-${{ github.run_id }}"
          docker pull "$IMAGE"
          CONTAINER_ID=$(docker create "$IMAGE")
          mkdir -p dist-linux
          docker cp "$CONTAINER_ID:/app/cryptobot" dist-linux/cryptobot
          docker cp "$CONTAINER_ID:/usr/local/lib/libduckdb.so" dist-linux/libduckdb.so
          docker rm "$CONTAINER_ID"
          tar -czf algotrap-Linux.tar.gz -C dist-linux cryptobot libduckdb.so

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: algotrap-Linux
          path: algotrap-Linux.tar.gz

  create-release:
    name: Create Release
    needs: [pre-check, build-and-push-docker]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.pre-check.outputs.commit_count > 0 }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly Build ${{ github.run_id }}
          tag_name: nightly-${{ github.run_id }}
          token: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
          draft: false
          prerelease: false
          files: |
            artifacts/algotrap-Linux/algotrap-Linux.tar.gz
