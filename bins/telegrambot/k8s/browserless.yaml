apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  labels:
    app: browserless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browserless
  template:
    metadata:
      labels:
        app: browserless
    spec:
      containers:
        - name: chromium
          image: ghcr.io/browserless/chromium:v2.33.0
          ports:
            - containerPort: 3000
          env:
            - name: CONCURRENT
              value: "5"
            - name: QUEUED
              value: "10"
            - name: TIMEOUT
              value: "30000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: browserless
  labels:
    app: browserless
spec:
  type: ClusterIP
  selector:
    app: browserless
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
