# ─── ConfigMap: litellm proxy config ──────────────────────────────────────────
# Edit model_list to add/remove models as needed.
# Docs: https://docs.litellm.ai/docs/proxy/configs
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels:
    app: litellm
data:
  config.yaml: |
    model_list:
      # ── 0x multiplier (free) GitHub Copilot models ──────────────
      # Auth: litellm uses OAuth device flow on first request.
      # Check pod logs for the auth URL + code.
      - model_name: gpt-5-mini
        litellm_params:
          model: github_copilot/gpt-5-mini
          reasoning_effort: high
          max_completion_tokens: 4096
          include_reasoning: true
      - model_name: gpt-4.1
        litellm_params:
          model: github_copilot/gpt-4.1
      - model_name: gpt-4o
        litellm_params:
          model: github_copilot/gpt-4o
      - model_name: raptor-mini
        litellm_params:
          model: github_copilot/raptor-mini

    general_settings:
      master_key: sk-litellm-proxy
      # Persistent proxy — using PVC for SQLite
      allow_requests_on_db_unavailable: true
      store_model_in_db: false
      disable_spend_logs: true
      disable_error_logs: true

    litellm_settings:
      drop_params: true
      set_verbose: false
---
# ─── Secret: API keys (for non-Copilot providers) ────────────────────────────
# GitHub Copilot uses OAuth device flow (no key needed).
# Persistent DATABASE_URL on PVC.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  labels:
    app: litellm
type: Opaque
stringData:
  DATABASE_URL: "sqlite:////root/.config/litellm/litellm.db"
  LITELLM_MASTER_KEY: "sk-litellm-proxy"
---
# ─── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          # Pinned to current working digest of main-latest
          image: ghcr.io/berriai/litellm@sha256:59a2736ac84800821fa0e1656487366089f2d29d10f8ae05c918df9c6e4940af
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: litellm-data
              mountPath: /root/.config/litellm
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 120  # 1200s for OAuth login
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 30
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 10
            failureThreshold: 120
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: litellm-data
          persistentVolumeClaim:
            claimName: litellm-data
---
# ─── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
