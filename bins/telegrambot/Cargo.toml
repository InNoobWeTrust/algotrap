[package]
name = "telegrambot"
version = "0.1.0"
edition = "2024"

[dependencies]
algotrap = { path = "../.." }

# Telegram
teloxide = { version = "0.17", features = ["macros"] }

# LLM (OpenAI-compatible via litellm)
async-openai = { version = "0.33", features = ["chat-completion"] }
llm-tool = "0.9"
schemars = "1"

# Async runtime
tokio = { version = "1.45", features = ["full"] }
futures = "0.3.31"

# HTTP client (for Browserless API)
reqwest = { version = "0.12", features = ["json"] }

# Data processing
polars = { version = "0.51", default-features = true, features = [
	"lazy",
	"fmt",
	"json",
	"timezones",
] }
rayon = "1.10.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config
dotenv = "0.15.0"
envy = "0.4"

# Time
chrono = "0.4"

# Templating
minijinja = "2.10"

# Logging
tracing = "0.1.41"
tracing-subscriber = "0.3"

# Encoding
base64 = "0.22"

[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
regex = "1"
