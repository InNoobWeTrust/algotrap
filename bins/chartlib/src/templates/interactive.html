    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100%;
            box-sizing: border-box;
        }

        #container {
            height: 100%;
        }

        #overlay {
            position: absolute;
            top: 2.5%;
            left: 2%;
            z-index: 9999;
            max-width: calc(100vw - 24px);
            transform-origin: top left;
        }
        #badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-width: calc(100vw - 24px);
        }
        #ticker-select {
            width: min(56vw, 220px);
            min-width: 0;
        }
        #ticker-row {
            display: inline-flex;
            align-items: stretch;
            gap: 4px;
            max-width: 100%;
            margin-bottom: 0.25rem;
            vertical-align: middle;
        }
        #ticker-select, #fullscreen-btn {
            box-sizing: border-box;
            height: 32px;
            margin: 0;
            vertical-align: middle;
        }
        #ticker-select::part(combobox) {
            box-sizing: border-box;
            height: 100%;
        }
        #fullscreen-btn {
            flex: none;
            width: 32px;
            display: grid;
            place-items: center;
            position: relative;
            z-index: 1;
            font-size: 16px;
        }
        #fullscreen-btn::part(button) {

            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            padding: 0;
            line-height: 1;
            color: #e8e8e8;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 4px;
        }
        #tf-picker {
            display: flex;

            max-width: calc(100vw - 24px);
            align-items: center;
        }
        #tf-scroll {

            min-width: 0;
            flex: 0 1 auto;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;

        #tf-picker wa-button {

        #tf-picker wa-button::part(button) {

            width: 100%;
            height: 100%;

        #tf-picker.scrollable wa-button {

        #tf-scroll::-webkit-scrollbar {

        #tf-btns {

        #tf-btns wa-radio {

            scroll-snap-align: start;

        /* Keep the tablet picker proportionate to the chart. */
        @media (max-width: 1024px) {
            #overlay { transform: scale(0.9); }
        }
        @media (max-width: 768px) {
            #overlay { top: 1.5%; transform: none; font-size: 13px; }
            #badges { gap: 2px; }
            #badges wa-badge { font-size: 8px; white-space: nowrap; }
            #badges wa-badge::part(badge) { padding: 0 4px; font-size: 8px; }
            #ticker-row { gap: 2px; margin-bottom: 2px; }
            #ticker-select { width: auto; min-width: 0; max-width: 30vw; height: 22px; --wa-form-control-height: 22px; --wa-form-control-padding-inline: 4px; font-size: 8px; }
            #ticker-select::part(combobox) { height: 22px; min-height: 0; padding: 0 4px; font-size: 8px; }
            #ticker-select::part(display-input) { font-size: 8px; }
            #fullscreen-btn { width: 22px; height: 22px; font-size: 12px; }
            #tf-picker, #tf-scroll { width: max-content; min-width: 0; max-width: 100%; }
            #tf-picker wa-button { width: 18px; height: 18px; font-size: 10px; }
            #tf-picker.scrollable #tf-scroll { mask-image: linear-gradient(to right, rgba(0, 0, 0, 0.35), black 12px, black calc(100% - 12px), rgba(0, 0, 0, 0.35)); }
            #tf-btns wa-radio { box-sizing: border-box; width: auto; min-width: 0; flex: none; height: 18px; min-height: 18px; padding: 0 4px; font-size: 8px; line-height: 1; white-space: nowrap; }

        @media (max-width: 480px) {

    <script>
      const fullscreenButton = document.getElementById('fullscreen-btn');
      const updateFullscreenIcon = () => {
        fullscreenButton.querySelector('wa-icon').name = document.fullscreenElement || document.webkitFullscreenElement
          ? 'compress' : 'expand';
      };

      async function toggleFullscreen(event) {
        event?.preventDefault();
        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            const elem = document.documentElement;
            const request = elem.requestFullscreen || elem.webkitRequestFullscreen;
            if (!request) throw new Error('Fullscreen API unavailable');
            await request.call(elem);
          } else {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            if (!exit) throw new Error('Fullscreen exit API unavailable');
            await exit.call(document);
          }
          updateFullscreenIcon();
        } catch (error) {
          console.error('Fullscreen toggle failed:', error);
        }
      }

      document.addEventListener('fullscreenchange', updateFullscreenIcon);
      document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
      updateFullscreenIcon();
    </script>
    <!-- Gap Zone Primitive classes (must be defined before onIntervalUpdate) -->
    <script type="text/javascript">
        class GapZoneBandRenderer {
            constructor(zones, chartData) { this._zones = zones; this._data = chartData; this._series = null; this._chart = null; }
            update(series, chart) { this._series = series; this._chart = chart; }
            draw(target) {
                const s = this._series; const c = this._chart;
                if (!s || !c || !this._data.length) return;
                target.useBitmapCoordinateSpace(scope => {
                    const ctx = scope.context;
                    const ts = c.timeScale();
                    const firstTime = this._data[0]?.time;
                    const lastTime = this._data[this._data.length - 1]?.time;
                    if (!firstTime || !lastTime) return;
                    const xLeft = ts.timeToCoordinate(firstTime);
                    const xRight = ts.timeToCoordinate(lastTime);
                    if (xLeft === null || xRight === null) return;
                    const ratio = scope.horizontalPixelRatio;
                    const vRatio = scope.verticalPixelRatio;
                    this._zones.forEach(z => {
                        const top = z.body_top ?? z.top;
                        const bottom = z.body_bottom ?? z.bottom;
                        const yTop = s.priceToCoordinate(top);
                        const yBot = s.priceToCoordinate(bottom);
                        if (yTop === null || yBot === null) return;
                        ctx.fillStyle = z.direction === 'bullish'
                            ? `rgba(33,150,243,0.12)`
                            : z.direction === 'bearish'
                                ? `rgba(255,152,0,0.12)`
                                : `rgba(158,158,158,0.12)`;
                        const x = Math.round(xLeft * ratio);
                        const w = Math.round((xRight - xLeft + 40) * ratio);
                        const y = Math.round(Math.min(yTop, yBot) * vRatio);
                        const h = Math.round(Math.abs(yBot - yTop) * vRatio);
                        ctx.fillRect(x, y, w, h);
                    });
                });
            }
        }
        class GapZonePaneView {
            constructor(renderer) { this._renderer = renderer; }
            renderer() { return this._renderer; }
        }
        class GapZonePrimitive {
            constructor(zones, chartData) {
                this._renderer = new GapZoneBandRenderer(zones, chartData);
                this._paneView = new GapZonePaneView(this._renderer);
            }
            attached({ series, chart }) { this._renderer.update(series, chart); }
            detached() { this._renderer.update(null, null); }
            paneViews() { return [this._paneView]; }
            updateAllViews() {}
        }
    </script>
    <script type="text/javascript">
        // ─── Config from template ─────────────────────────────────────
        const tickers = {{ tickers_json }};
        const chartTfs = {{ chart_tfs }};

        // ─── DOM refs ─────────────────────────────────────────────────
        const tickerSelect = document.getElementById('ticker-select');
        const tf_btns = document.getElementById('tf-btns');
        const tfPicker = document.getElementById('tf-picker');
        const tfScroll = document.getElementById('tf-scroll');
        const tfPrev = document.getElementById('tf-prev');
        const tfNext = document.getElementById('tf-next');
        const container = document.getElementById('container');
        const slBadge = document.getElementById('sl-badge');
        const tolBadge = document.getElementById('tol-badge');
        const atr_badge = document.getElementById('atr-percent');
        const lvrg_badge = document.getElementById('leverage');
        const loadingOverlay = document.getElementById('loading-overlay');

        // ─── Global state ─────────────────────────────────────────────
        let dataset = {};
        let currentTicker = null;

        // ─── Populate ticker dropdown ─────────────────────────────────
        tickers.forEach(t => {
            const opt = document.createElement('wa-option');
            opt.value = t.symbol;
            opt.textContent = `BingX:${t.symbol}`;
            tickerSelect.appendChild(opt);
        });

        // ─── Create chart ─────────────────────────────────────────────
        const chart = LightweightCharts.createChart(container, {
            autoSize: true,
            layout: {
                background: { color: '#22222240' },
                textColor: '#DDD',
            },
            grid: {
                vertLines: { color: '#44444440' },
                horzLines: { color: '#44444440' },
            },
            timeScale: {
                timeVisible: true,
            },
        });
        const volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
            priceFormat: {
                type: 'volume',
            },
            priceScaleId: '', // set as an overlay by setting a blank priceScaleId
        });
        volumeSeries.priceScale().applyOptions({
            scaleMargins: {
                top: 0.8,
                bottom: 0,
            },
        });
        const volumeSmaSeries = chart.addSeries(LightweightCharts.AreaSeries, {
            lineColor: '#00000000',
            topColor: '#FDD8354C',
            bottomColor: '#FDD8352F',
            priceFormat: {
                type: 'volume',
            },
            priceScaleId: '',
        });
        volumeSmaSeries.priceScale().applyOptions({
            scaleMargins: {
                top: 0.8,
                bottom: 0,
            },
        });
        const ema200Series = chart.addSeries(LightweightCharts.LineSeries, {});
        const biasRevSeries = chart.addSeries(LightweightCharts.LineSeries, {});
        const atrUpperBandSeries = chart.addSeries(LightweightCharts.LineSeries, {});
        const atrLowerBandSeries = chart.addSeries(LightweightCharts.LineSeries, {});
        const neutralRevRsiSeries = chart.addSeries(LightweightCharts.LineSeries, { lineWidth: 6, lineStyle: 2 });
        const bullishBandSeries = chart.addSeries(LightweightCharts.LineSeries, { lineWidth: 6 });
        const bearishBandSeries = chart.addSeries(LightweightCharts.LineSeries, { lineWidth: 6 });
        const candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries);
        const structurePwrSeries = chart.addSeries(LightweightCharts.HistogramSeries, {}, 1);
        const structurePwrSmaSeries = chart.addSeries(LightweightCharts.BaselineSeries, {
            baseValue: { type: 'price', price: 0 },
            topLineColor: 'rgba(76, 175, 80, 0.3)',
            topFillColor1: 'rgba(76, 175, 80, 0.2)',
            topFillColor2: 'rgba(76, 175, 80, 0.5)',
            bottomLineColor: 'rgba(242, 54, 69, 0.3)',
            bottomFillColor1: 'rgba(242, 54, 69, 0.5)',
            bottomFillColor2: 'rgba(242, 54, 69, 0.2)',
        }, 1);
        const structurePwrDirSeries = chart.addSeries(LightweightCharts.BaselineSeries, {
            baseValue: { type: 'price', price: 0 },
            topLineColor: 'rgba(76, 175, 80, 0.5)',
            topFillColor1: 'rgba(76, 175, 80, 0.05)',
            topFillColor2: 'rgba(76, 175, 80, 0.1)',
            bottomLineColor: 'rgba(242, 54, 69, 0.5)',
            bottomFillColor1: 'rgba(242, 54, 69, 0.1)',
            bottomFillColor2: 'rgba(242, 54, 69, 0.05)',
        }, 1);
        const atrRevSeries = chart.addSeries(LightweightCharts.LineSeries, {}, 2);
        const ichingOriginalSeries = chart.addSeries(LightweightCharts.LineSeries, {
            // 本卦 Original average: intra-bar OHLC range is usually tiny, so
            // candlesticks collapse to flat ticks. Plot the OHLC average as a
            // stepped foreground line — near-opaque so it stays distinguishable
            // above the muted mutual background band.
            color: 'rgba(79, 195, 247, 0.95)',
            lineWidth: 2,
            lineType: 1,
            priceLineVisible: false,
            crosshairMarkerVisible: false,
        }, 3);
        const ichingTransformedSeries = chart.addSeries(LightweightCharts.LineSeries, { color: 'rgba(255, 183, 77, 0.40)', lineWidth: 2, lineStyle: 2, lineType: 1 }, 3);
        // 互卦 mutual inner band (background wash + edge lines).
        // Lightweight-Charts v5 supports only a fixed price `baseValue` (no
        // dynamic series-to-series fill), so a true "fill strictly between the
        // two boundary lines" is impossible: each BaselineSeries fills its
        // line to zero, so fill overlap is NOT the inner range — the inner
        // range is the subtraction (area between the stepped high/low lines).
        // Hence the band edges are drawn as visible stepped lines (0.40/1px)
        // while fills stay equal and modest (0.15→0.00) as pure sign wash:
        //   - above zero -> cool TradingView teal-green #26A69A (positive),
        //   - below zero -> hot TradingView coral-red #EF5350 (negative).
        // Mean is line-only (fills 0.00) so it never muddies the wash.
        const ichingBoundaryOptions = {
            baseValue: { type: 'price', price: 0 },
            topLineColor: 'rgba(38, 166, 154, 0.40)',
            topFillColor1: 'rgba(38, 166, 154, 0.15)',
            topFillColor2: 'rgba(38, 166, 154, 0.00)',
            bottomLineColor: 'rgba(239, 83, 80, 0.40)',
            bottomFillColor1: 'rgba(239, 83, 80, 0.00)',
            bottomFillColor2: 'rgba(239, 83, 80, 0.15)',
            lineWidth: 1,
            lineType: 1,
            priceLineVisible: false,
            crosshairMarkerVisible: false,
        };
        const ichingMutualHighSeries = chart.addSeries(LightweightCharts.BaselineSeries, {
            ...ichingBoundaryOptions,
        }, 3);
        const ichingMutualLowSeries = chart.addSeries(LightweightCharts.BaselineSeries, {
            ...ichingBoundaryOptions,
        }, 3);
        const ichingMutualMeanSeries = chart.addSeries(LightweightCharts.BaselineSeries, {
            baseValue: { type: 'price', price: 0 },
            // Mean line: slightly lighter than the band wash so it reads on
            // top of the fills, but capped at 0.40/1px so it stays below the
            // Transformed dashed line (0.40/2px) in visual weight. Fills are
            // 0.00 (line-only) so the high/low overlap alone defines the
            // inner-range highlight.
            topLineColor: 'rgba(110, 231, 183, 0.40)',
            topFillColor1: 'rgba(45, 218, 178, 0.00)',
            topFillColor2: 'rgba(45, 218, 178, 0.00)',
            bottomLineColor: 'rgba(252, 165, 165, 0.40)',
            bottomFillColor1: 'rgba(255, 110, 118, 0.00)',
            bottomFillColor2: 'rgba(255, 110, 118, 0.00)',
            lineWidth: 1,
            lineType: 1,
            priceLineVisible: false,
            crosshairMarkerVisible: false,
        }, 3);
        // A pane primitive keeps the NOW divider vertical at the exact first future time.
        // Two points with the same time in a LineSeries violate LWC's unique-time rule.
        class IchingNowDivider {
            constructor() { this.time = null; }
            attached({ chart, requestUpdate }) {
                this.chart = chart;
                this.requestUpdate = requestUpdate;
            }
            detached() { this.chart = null; this.requestUpdate = null; }
            paneViews() {
                return [{ renderer: () => ({ draw: target => {
                    if (this.time === null || !this.chart) return;
                    target.useBitmapCoordinateSpace(scope => {
                        const x = this.chart.timeScale().timeToCoordinate(this.time);
                        if (x === null) return;
                        const px = Math.round(x * scope.horizontalPixelRatio);
                        const ctx = scope.context;
                        ctx.fillStyle = 'rgba(178, 181, 190, 0.55)';
                        ctx.fillRect(px, 0, Math.max(1, Math.round(scope.horizontalPixelRatio)), scope.bitmapSize.height);
                        ctx.fillStyle = 'rgba(221, 221, 221, 0.8)';
                        ctx.font = `${Math.round(11 * scope.verticalPixelRatio)}px sans-serif`;
                        ctx.fillText('NOW', px + 4 * scope.horizontalPixelRatio, 16 * scope.verticalPixelRatio);
                    });
                } }) }];
            }
            setTime(time) { this.time = time; this.requestUpdate?.(); }
        }
        const ichingNowDivider = new IchingNowDivider();
        ichingOriginalSeries.attachPrimitive(ichingNowDivider);
        const markersSeries = LightweightCharts.createSeriesMarkers(candlestickSeries, []);
        const textWatermarks = [
            // Pane 0 title sits top-right, beside the top-left picker overlay,
            // so the two never stack on top of each other.
            LightweightCharts.createTextWatermark(chart.panes()[0], {
                horzAlign: 'right',
                vertAlign: 'top',
            }),
            LightweightCharts.createTextWatermark(chart.panes()[1], {
                horzAlign: 'left',
                vertAlign: 'top',
            }),
            LightweightCharts.createTextWatermark(chart.panes()[2], {
                horzAlign: 'left',
                vertAlign: 'top',
            }),
            LightweightCharts.createTextWatermark(chart.panes()[3], {
                horzAlign: 'left',
                vertAlign: 'top',
            }),
        ];

        // ─── Watermark update ─────────────────────────────────────────
        let hasForecast = false;
        let flatForecast = false;
        const horizonContext = document.createElement('canvas').getContext('2d');
        const pane3PlotWidth = () => {
            const pane = chart.panes()[3];
            const apiWidth = pane.getWidth?.();
            if (Number.isFinite(apiWidth) && apiWidth > 0) return apiWidth;
            const canvasWidth = pane.getHTMLElement?.()?.querySelector('canvas')?.getBoundingClientRect().width;
            if (Number.isFinite(canvasWidth) && canvasWidth > 0) return canvasWidth;
            const axisWidth = ichingOriginalSeries.priceScale().width();
            if (Number.isFinite(axisWidth) && axisWidth > 0) {
                const plotWidth = container.clientWidth - axisWidth;
                if (Number.isFinite(plotWidth) && plotWidth > 0) return plotWidth;
            }
            return null;
        };
        const pane3Horizon = () => {
            const paneWidth = pane3PlotWidth();
            const prefix = 'Signal Horizon · 卦象时窗';
            const candidates = [
                `${prefix} · Calendrical cast schedule · not a price forecast${flatForecast ? ' · No cast change in this window' : ''}`,
                `${prefix} · calendar · not a forecast${flatForecast ? ' · no change' : ''}`,
                `Calendar · 卦象时窗${flatForecast ? ' · flat' : ''}`,
            ];
            if (horizonContext) horizonContext.font = `12px ${chart.options().layout.fontFamily}`;
            const sampleWidth = horizonContext?.measureText(candidates[2]).width;
            const context = horizonContext?.font.includes('12px') && Number.isFinite(sampleWidth) && sampleWidth > 0
                ? horizonContext : null;
            const wide = context !== null && Number.isFinite(paneWidth) && context.measureText(candidates[0]).width <= paneWidth - 8;
            const text = (context && Number.isFinite(paneWidth) ? candidates.find(candidate => context.measureText(candidate).width <= paneWidth - 8) : null) ?? candidates[2];
            return { text, wide };
        };
        const watermarkUpdate = () => {
            const horizon = pane3Horizon();
            const tf = tf_btns.value || container.dataset.tf || chartTfs[0];
            const lastBar = dataset[tf]?.candles?.slice(-1)[0];
            if (lastBar) {
                const atr = +(lastBar.atr_percent * 100).toFixed(2);
                const lvrg = Math.floor(lastBar.leverage);
                atr_badge.innerHTML = `ATR: ${atr}%`;
                lvrg_badge.innerHTML = `x${lvrg}`;
            }
            const watermarks = [
                {
                    lines: [
                        {
                            text: `${container.dataset.symbol} ${tf}`,
                            color: 'rgba(178, 181, 190, 0.32)',
                            fontSize: Math.max(13, Math.min(24, Math.floor((container.clientWidth || 1200) / 55))),
                        },
                    ],
                },
                {
                    lines: [
                        {
                            text: 'Structure Power (9, 16)',
                            color: 'rgba(178, 181, 190, 0.5)',
                            fontSize: 18,
                        },
                    ],
                },
                {
                    lines: [
                        {
                            text: 'ATR Reversion (42, 1.618)',
                            color: 'rgba(178, 181, 190, 0.5)',
                            fontSize: 18,
                        },
                    ],
                },
                {
                    lines: [
                        ...(hasForecast ? [
                            {
                                text: horizon.text,
                                color: 'rgba(178, 181, 190, 0.8)',
                                fontSize: 12,
                            },
                        ] : []),
                        {
                            text: '本卦 I-Ching Original average',
                            color: '#4FC3F7',
                            fontSize: 13,
                        },
                        {
                            text: '变卦目的 Within-Cast Destination',
                            color: '#FFB74D',
                            fontSize: 13,
                        },
                        {
                            text: '互卦 Mutual inner band + mean',
                            color: '#26A69A',
                            fontSize: 13,
                        },
                    ],
                },
            ];
            Object.entries(textWatermarks).forEach(([k,v]) => {
                v.applyOptions(watermarks[k]);
            });
        }

        // ─── TF update ────────────────────────────────────────────────
        const updateVisibleRange = (forecast) => {
            const len = chart.panes()[0].getSeries()[0].data().length;
            const lastIndex = forecast.length > 0
                ? chart.timeScale().timeToIndex(Math.floor(forecast[forecast.length - 1].time / 1000))
                : null;
            const to = lastIndex === null ? len + 5 : lastIndex + 5;
            if (pane3Horizon().wide) {
                chart.timeScale().setVisibleLogicalRange({ from: len - 128, to });
            } else {
                chart.timeScale().setVisibleLogicalRange({ from: len - 40, to });
            }
        };
        const onIntervalUpdate = (tf) => {
            const tfData = dataset[tf];
            if (!tfData) return;
            const data = tfData.candles.map(d => ({
                ...d,
                time: Math.floor(d.time / 1000),
            }));
            candlestickSeries.setData(data);
            volumeSeries.setData(data.map(d => ({
                time: d.time,
                value: d.volume,
                color: d.volume_color,
            })));
            volumeSmaSeries.setData(data.map(d => ({
                time: d.time,
                value: d.volume_sma,
            })));
            ema200Series.setData(data.map(d => ({
                time: d.time,
                value: d.ema200,
                color: d.ema200_color,
            })));
            biasRevSeries.setData(data.map(d => ({
                time: d.time,
                value: d.bias_reversion,
                color: d.bias_reversion_color,
            })));
            atrUpperBandSeries.setData(data.map(d => ({
                time: d.time,
                value: d.atr_upperband,
                color: d.atr_upperband_color,
            })));
            atrLowerBandSeries.setData(data.map(d => ({
                time: d.time,
                value: d.atr_lowerband,
                color: d.atr_lowerband_color,
            })));
            neutralRevRsiSeries.setData(data.map(d => ({
                time: d.time,
                value: d.neutral_revrsi,
                color: d.neutral_revrsi_color,
            })));
            bullishBandSeries.setData(data.map(d => ({
                time: d.time,
                value: d.bullish_revrsi,
                color: d.bullish_revrsi_color,
            })));
            bearishBandSeries.setData(data.map(d => ({
                time: d.time,
                value: d.bearish_revrsi,
                color: d.bearish_revrsi_color,
            })));
            structurePwrSeries.setData(data.map(d => ({
                time: d.time,
                value: d.structure_power,
                color: d.structure_power_color,
            })));
            structurePwrSmaSeries.setData(data.map(d => ({
                time: d.time,
                value: d.structure_power_sma,
            })));
            structurePwrDirSeries.setData(data.map(d => ({
                time: d.time,
                value: d.structure_power_direction,
            })));
            atrRevSeries.setData(data.map(d => ({
                time: d.time,
                value: d.atr_reversion_percent,
                color: d.atr_reversion_percent_color,
            })));
            const forecast = Array.isArray(tfData.forecast) ? tfData.forecast : [];
            const forecastPoints = forecast.map(d => ({ ...d, time: Math.floor(d.time / 1000) }));
            // Projected line alpha is 60% of history with a 0.30 visibility floor;
            // historical lines stay above that floor. Nonzero fills are 60% of
            // history and may be lighter than the lines (zero stops stay clear).
            ichingOriginalSeries.setData([
                ...data.map(d => ({
                    time: d.time,
                    value: (d.iching_open + d.iching_high + d.iching_low + d.iching_close) / 4,
                })).filter(p => Number.isFinite(p.value)),
                ...forecastPoints.map(d => ({ time: d.time, value: d.original, color: 'rgba(79, 195, 247, 0.57)' })),
            ]);
            ichingTransformedSeries.setData([
                ...data.map(d => ({ time: d.time, value: d.iching_transformed_close })),
                ...forecastPoints.map(d => ({ time: d.time, value: d.transformed, color: 'rgba(255, 183, 77, 0.30)' })),
            ]);
            const projectedMutualColors = {
                topLineColor: 'rgba(38, 166, 154, 0.30)',
                topFillColor1: 'rgba(38, 166, 154, 0.09)',
                topFillColor2: 'rgba(38, 166, 154, 0.00)',
                bottomLineColor: 'rgba(239, 83, 80, 0.30)',
                bottomFillColor1: 'rgba(239, 83, 80, 0.00)',
                bottomFillColor2: 'rgba(239, 83, 80, 0.09)',
            };
            ichingMutualHighSeries.setData([
                ...data.map(d => ({ time: d.time, value: d.iching_mutual_high })),
                ...forecastPoints.map(d => ({ time: d.time, value: d.mutual_high, ...projectedMutualColors })),
            ]);
            ichingMutualLowSeries.setData([
                ...data.map(d => ({ time: d.time, value: d.iching_mutual_low })),
                ...forecastPoints.map(d => ({ time: d.time, value: d.mutual_low, ...projectedMutualColors })),
            ]);
            ichingMutualMeanSeries.setData([
                ...data.map(d => ({ time: d.time, value: d.iching_mutual_mean })),
                ...forecastPoints.map(d => ({
                    time: d.time,
                    value: d.mutual_mean,
                    topLineColor: 'rgba(110, 231, 183, 0.30)',
                    bottomLineColor: 'rgba(252, 165, 165, 0.30)',
                    topFillColor1: 'rgba(45, 218, 178, 0.00)',
                    topFillColor2: 'rgba(45, 218, 178, 0.00)',
                    bottomFillColor1: 'rgba(255, 110, 118, 0.00)',
                    bottomFillColor2: 'rgba(255, 110, 118, 0.00)',
                })),
            ]);
            hasForecast = forecast.length > 0;
            flatForecast = hasForecast && forecast.every(d =>
                d.original === forecast[0].original &&
                d.transformed === forecast[0].transformed &&
                d.mutual_high === forecast[0].mutual_high &&
                d.mutual_low === forecast[0].mutual_low &&
                d.mutual_mean === forecast[0].mutual_mean);
            ichingNowDivider.setTime(hasForecast ? forecastPoints[0].time : null);
            const markers = [];
            // ATR Climax circles
            data.forEach(d => {
                if (d.close >= d.atr_upperband) {
                    markers.push({
                        time: d.time,
                        position: 'aboveBar',
                        shape: 'circle',
                        color: 'rgba(157,225,159,0.7)',
                        size: 3,
                    });
                }
                if (d.close <= d.atr_lowerband) {
                    markers.push({
                        time: d.time,
                        position: 'belowBar',
                        shape: 'circle',
                        color: 'rgba(201,134,134,0.7)',
                        size: 3,
                    });
                }
            });
            markers.sort((a, b) => a.time - b.time);
            markersSeries.setMarkers(markers);

            // ─── Gap Zone Bands (precomputed) ──────────────────────────
            const suppliedGaps = Array.isArray(tfData.gapZones) ? tfData.gapZones : [];
            if (window._gapPrimitive) {
                try { candlestickSeries.detachPrimitive(window._gapPrimitive); } catch(_) {}
            }
            if (suppliedGaps.length > 0) {
                window._gapPrimitive = new GapZonePrimitive(suppliedGaps, data);
                candlestickSeries.attachPrimitive(window._gapPrimitive);
            }

            updateVisibleRange(forecast);
            watermarkUpdate();
        }

        // ─── Layout ───────────────────────────────────────────────────
        const onSizeUpdate = () => {
            const tf = tf_btns.value || container.dataset.tf || chartTfs[0];
            const forecast = dataset[tf]?.forecast;
            updateVisibleRange(Array.isArray(forecast) ? forecast : []);
            const containerHeight = document.getElementById("container").getClientRects()[0].height;
            if (pane3Horizon().wide) {
                chart.panes()[0].setHeight(Math.floor(containerHeight * 0.60));
            } else {
                chart.panes()[0].setHeight(Math.floor(containerHeight * 0.48));
            }
            watermarkUpdate();
        }
        const resizeObserver = new ResizeObserver((entries) => {
            requestAnimationFrame(() => {
                onSizeUpdate();
            });
        });
        resizeObserver.observe(container);

        // ─── TF buttons ───────────────────────────────────────────────
        chartTfs.forEach(tf => {
            const tf_btn = document.createElement('wa-radio');
            tf_btn.appearance = 'button';
            tf_btn.innerText = tf;
            tf_btn.value = tf
            tf_btn.addEventListener('click', () => {
                requestAnimationFrame(() => {
                    onIntervalUpdate(tf);
                });
            });
            tf_btns.appendChild(tf_btn);
        });

        const updateTfScroll = () => {
            // Compare content with the capped picker width, not the chevron-reduced scroll viewport.
            const scrollable = tf_btns.scrollWidth > tfPicker.getBoundingClientRect().width + 2;
            tfPicker.classList.toggle('scrollable', scrollable);
            const maxScroll = Math.max(0, tfScroll.scrollWidth - tfScroll.clientWidth);
            tfPrev.hidden = !scrollable || tfScroll.scrollLeft <= 2;
            tfNext.hidden = !scrollable || tfScroll.scrollLeft >= maxScroll - 2;
        };
        tfPrev.addEventListener('click', () => tfScroll.scrollBy({ left: -Math.max(120, tfScroll.clientWidth * 0.6), behavior: 'smooth' }));
        tfNext.addEventListener('click', () => tfScroll.scrollBy({ left: Math.max(120, tfScroll.clientWidth * 0.6), behavior: 'smooth' }));
        tfScroll.addEventListener('scroll', updateTfScroll);
        const tfResizeObserver = new ResizeObserver(updateTfScroll);
        tfResizeObserver.observe(tfPicker);
        tfResizeObserver.observe(tf_btns);
        window.addEventListener('resize', updateTfScroll);
        requestAnimationFrame(updateTfScroll);

        // ─── Ticker loading ───────────────────────────────────────────
        async function loadTicker(symbol) {
            loadingOverlay.classList.add('active');
            try {
                const resp = await fetch(`data/${symbol}.json`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                dataset = await resp.json();

                const ticker = tickers.find(t => t.symbol === symbol);
                currentTicker = ticker;
                container.dataset.symbol = `BingX:${symbol}`;
                container.dataset.tf = ticker.default_tf;

                // Update badges
                slBadge.innerHTML = `SL: ${ticker.sl_percent}%`;
                tolBadge.innerHTML = `Tol: ${ticker.tol_percent}%`;

                // Update page title
                document.title = `BingX:${symbol} (InNoobWeTrust™)`;

                // Click default TF
                requestAnimationFrame(() => {
                    const selectedBtn = [...tf_btns.children].find(b => b.textContent == ticker.default_tf)
                        || tf_btns.children[0];
                    if (selectedBtn) {
                        tf_btns.value = selectedBtn.value;
                        selectedBtn.click();
                        selectedBtn.scrollIntoView({ inline: 'center', block: 'nearest' });
                    }
                });
            } catch(e) {
                console.error(`Failed to load ticker data for ${symbol}:`, e);
            } finally {
                loadingOverlay.classList.remove('active');
            }
        }

        // ─── URL sync + init ──────────────────────────────────────────
        tickerSelect.addEventListener('change', (e) => {
            const symbol = e.target.value;
            history.replaceState(null, '', `?ticker=${symbol}`);
            loadTicker(symbol);
        });

        // Initial load from URL params or first ticker
        const params = new URLSearchParams(location.search);
        const initialTicker = params.get('ticker') || tickers[0]?.symbol;
        if (initialTicker) {
            tickerSelect.value = initialTicker;
            loadTicker(initialTicker);
        }
    </script>
  </body>
</html>
